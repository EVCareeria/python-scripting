<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cowrie C2 | Create Initial User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #020817, #111827 55%, #0f172a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
        }
        .auth-card {
            width: min(100%, 480px);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            border-radius: 1rem;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>
<body>
    <div class="auth-card p-4 p-md-5">
        <div class="mb-4">
            <h2 class="fw-bold mb-1">Create administrator</h2>
            <p class="text-muted mb-0">This is the first launch. Create the single allowed user account.</p>
        </div>

        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" maxlength="64" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" minlength="12" required>
                <div class="form-text text-muted">Minimum 12 characters. Stored with PBKDF2-HMAC-SHA256 (210000 iterations).</div>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label">Confirm password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="12" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Create account</button>
        </form>
    </div>
</body>
</html>
